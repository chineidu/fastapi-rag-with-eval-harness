[project]
name = "fastapi-rag-with-eval-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "fastapi[standard-no-fastapi-cloud-cli]>=0.140.13",
  "fastembed>=0.8.0",
  "instructor>=1.15.4",
  "msgspec>=0.21.1",
  "omegaconf>=2.3.1",
  "pydantic-settings>=2.14.2",
  "python-json-logger>=4.1.0",
]

[dependency-groups]
dev = [
  "prek>=0.4.11",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.0",
  "ty>=0.0.64",
]

[tool.coverage.run]
source = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=src --cov-report=term-missing --cov-fail-under=80 -m 'not slow'"
markers = [
  "slow: downloads model weights or makes network calls; deselected by default",
]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
extend-exclude = ["docs/fastapi"]

[tool.ruff.lint]
extend-select = [
    "T201",  # print-found
    "PTH",   # flake8-use-pathlib
    "N",     # pep8-naming (snake_case, PascalCase, UPPER_SNAKE_CASE)
    "D",     # pydocstyle (NumPy-style docstrings)
    "S",     # flake8-bandit (secrets, os.system, subprocess)
    "E501",  # line-too-long (ruff disables by default)
]

[tool.ruff.lint.pycodestyle]
max-line-length = 110

[tool.ruff.lint.per-file-ignores]
"src/__init__.py" = ["RUF012"]
"tests/**/*.py" = ["S101", "D100", "D101", "D102", "D103", "D104"]

[tool.ty.src]
exclude = ["docs/fastapi"]
