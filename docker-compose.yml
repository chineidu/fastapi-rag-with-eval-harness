# Self-hosted Qdrant for the RAG vector index (ADR-0020).
#
#   docker compose up -d     start (creates the qdrant_data volume on first run)
#   docker compose down      stop (keeps indexed vectors)
#   docker compose down -v   stop and delete all indexed vectors
#
# The REST API on 6333 is what src/app/vector_store/qdrant.py talks to.
# 6334 is the gRPC endpoint, exposed for debugging tools.
services:
  qdrant:
    # Pinned to v1.16.3
    image: qdrant/qdrant:v1.16.3
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The image has no curl/nc/wget; bash opens a TCP socket directly.
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  qdrant_data:
